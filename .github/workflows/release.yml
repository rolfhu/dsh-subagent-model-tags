name: Release

# Two entry points, one pipeline:
#
#   A. Releases page (recommended): Releases -> Draft a new release -> tag
#      vX.Y.Z -> Publish. GitHub creates the tag and the Release; this workflow
#      then writes the version, commits the bump, and moves the tag onto that
#      commit.
#   B. Actions tab: Run workflow -> enter the version. This workflow creates
#      the tag and the Release itself, with notes generated from the commits
#      since the previous release.
#
# Either way the tag's tree ends up identical to what gets published — the
# shape `npm version` produces.
#
# Authentication is npm Trusted Publishing: no token is stored here. The npm
# package must list this repository and this workflow file under
# Settings -> Trusted publishing. npm exchanges the GitHub OIDC identity for a
# short-lived publish token and attaches a provenance attestation.
#
# The connection must allow the direct "npm publish" action; a connection that
# only allows "npm stage publish" (the default for connections created after
# 2026-09-03) makes this step fail with 403 OIDC permission denied. Connections
# cannot be edited — delete and recreate with direct publish allowed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.0.3)"
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use the latest npm
        run: npm i -g npm@latest
      - name: Report publish environment
        run: |
          node --version
          npm --version
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL}" ]; then
            echo "OIDC token endpoint is available"
          else
            echo "OIDC token endpoint is MISSING (id-token: write not granted)"
          fi
      - name: Resolve version and tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "not a semver version: '$version' — the tag must look like v1.2.3"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "publishing v$version"
      - name: Check the version is newer than the published one
        run: |
          published="$(npm view "@hukj/dsh-subagent-model-tags" version 2>/dev/null || true)"
          if [ -z "$published" ]; then
            echo "nothing published yet; proceeding"
            exit 0
          fi
          node -e "
            const parse = (v) => {
              const dash = v.indexOf('-');
              return {
                core: (dash === -1 ? v : v.slice(0, dash)).split('.').map(Number),
                pre: dash === -1 ? null : v.slice(dash + 1),
              };
            };
            const cmp = (a, b) => {
              for (let i = 0; i < 3; i++) if (a.core[i] !== b.core[i]) return a.core[i] - b.core[i];
              if (!a.pre !== !b.pre) return a.pre ? -1 : 1;
              return a.pre < b.pre ? -1 : a.pre > b.pre ? 1 : 0;
            };
            const next = parse(process.argv[1]);
            const current = parse(process.argv[2]);
            if (cmp(next, current) < 0) {
              console.error(process.argv[1] + ' is older than the published ' + process.argv[2] + ' — refusing');
              process.exit(1);
            }
            console.log(process.argv[1] + ' vs published ' + process.argv[2] + ': ok');
          " "${{ steps.version.outputs.version }}" "$published"
      - name: Write the version into package.json
        run: |
          node -e "
            const fs = require('fs');
            const version = process.env.VERSION;
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (pkg.version !== version) {
              pkg.version = version;
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
              console.log('package.json version set to ' + version);
            } else {
              console.log('package.json already at ' + version);
            }
          "
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - name: Self-check
        run: node test/selftest.cjs
      - name: Commit the bump and align the tag
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="${{ steps.version.outputs.tag }}"
          if git diff --quiet -- package.json; then
            echo "package.json already at this version"
          else
            git add package.json
            git commit -m "chore: release ${{ steps.version.outputs.version }} [skip ci]"
            git push origin HEAD:main
            echo "bump committed to main"
          fi
          # Create the tag on a dispatch run; move it onto the bump commit on a
          # tag-push run. Force-pushing a missing tag is a plain create. The
          # push uses the default GITHUB_TOKEN, which GitHub does not let
          # re-trigger workflows; should a run start anyway, it finds the
          # version already published and exits.
          git tag -f "$tag"
          git push -f origin "refs/tags/$tag"
          echo "tag $tag now points at $(git rev-parse HEAD)"
      - name: Ensure a GitHub Release exists
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists"
            exit 0
          fi
          gh release create "$tag" \
            --title "${{ steps.version.outputs.version }}" \
            --generate-notes
      - name: Skip an already published version
        run: |
          version="${{ steps.version.outputs.version }}"
          if npm view "@hukj/dsh-subagent-model-tags@${version}" version >/dev/null 2>&1; then
            echo "already published; nothing to do"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: Publish
        if: env.SKIP != '1'
        run: |
          set -o pipefail
          npm publish --access public --provenance --loglevel=notice 2>&1 | tee publish-output.log
      - name: Show publish output on failure
        if: always() && env.SKIP != '1'
        run: |
          if [ -f publish-output.log ]; then
            echo "----- publish output -----"
            cat publish-output.log
            echo "----- end publish output -----"
          else
            echo "no publish output was produced"
          fi
